<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER MARTY BROS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="arcade">
  <div class="hud">
    <div class="hud-block">
      <span class="hud-label">MARTY</span>
      <span class="hud-value" id="score">000000</span>
    </div>
    <div class="hud-block">
      <span class="hud-label"><span class="coin-icon"></span>&times;</span>
      <span class="hud-value" id="coins">00</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">WORLD</span>
      <span class="hud-value" id="world">1-1</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">TIME</span>
      <span class="hud-value" id="time">400</span>
    </div>
  </div>

  <div class="screen">
    <canvas id="board" width="704" height="448"></canvas>
    <audio id="martyBrosMusic" preload="auto" loop src="assets/marty-bros-theme.webm"></audio>
    <audio id="martyFlagRunSfx" preload="auto" src="assets/marty-flag-run.wav"></audio>
    <audio id="martyPipeSfx" preload="auto" src="assets/marty-pipe.wav"></audio>
    <audio id="martyFireballSfx" preload="auto" src="assets/marty-fireball.wav"></audio>

    <div class="overlay hidden" id="clearOverlay">
      <p class="big-text">¡ESTÁS A 88 MILLAS POR HORA!</p>
      <p class="score-text">Puntuación: <span id="finalScore">0</span></p>
    </div>
  </div>
</div>

<script src="sound.js"></script>
<script src="game.js"></script>
</body>
</html>
